# Example nginx server block. Adjust server_name, root and SCRIPT_FILENAME,
# and add TLS settings as needed.
#
# Static files come straight from public/; every other request runs bin/recipe
# through fcgiwrap, which forks and execs a fresh process per request.
server {
    listen 80;
    server_name example.com;

    root /path/to/allerhande/public;
    index index.html;

    location / {
        try_files $uri $uri/ @recipe;
    }

    location @recipe {
        gzip off;  # ~1 KB of text: compressing costs more than it saves
        fastcgi_pass unix:/var/run/fcgiwrap.socket;
        # The program reads no request data, so pass only what fcgiwrap needs
        # instead of the full fastcgi_params.
        fastcgi_param SCRIPT_FILENAME /path/to/allerhande/bin/recipe;
        fastcgi_param REQUEST_METHOD $request_method;
    }
}
