# Example nginx server block. Adjust server_name and root, and add TLS settings
# as needed.
#
# Static files come straight from public/; every other request goes to the
# recipe FastCGI server (see kookboek.socket / kookboek.service), which forks a
# fresh process per request.
server {
    listen 80;
    server_name example.com;

    root /path/to/allerhande/public;
    index index.html;

    location / {
        try_files $uri $uri/ @recipe;
    }

    location @recipe {
        gzip off;  # ~1 KB of text: compressing costs more than it saves
        # The program reads no request data, so no fastcgi_param lines are needed.
        fastcgi_pass unix:/run/kookboek.sock;
    }
}
